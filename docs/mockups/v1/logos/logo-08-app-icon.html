<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo 08 — App Icon · MediSlot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #f5f6f8; color: #1a1d23; padding: 0; line-height: 1.5; }
  .badge { position: fixed; top: 12px; right: 12px; background: #0f766e; color: white; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; z-index: 100; box-shadow: 0 2px 6px rgba(15,118,110,0.3); }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; }
  .sticker { background: white; padding: 60px 80px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); text-align: center; }

  /* App-icon style square mark */
  .icon-grid { display: flex; align-items: flex-end; gap: 24px; justify-content: center; margin-bottom: 28px; }
  .ic { border-radius: 22%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-family: "Inter", sans-serif; }
  .ic-128 { width: 128px; height: 128px; font-size: 64px; background: linear-gradient(135deg, #14b8a6 0%, #0f766e 100%); box-shadow: 0 8px 24px rgba(15,118,110,0.3); }
  .ic-64 { width: 64px; height: 64px; font-size: 32px; background: linear-gradient(135deg, #14b8a6 0%, #0f766e 100%); }
  .ic-32 { width: 32px; height: 32px; font-size: 16px; background: linear-gradient(135deg, #14b8a6 0%, #0f766e 100%); }

  .icon-grid .ic::after {
    content: ""; position: relative;
    display: block; width: 50%; height: 50%;
    background: white;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='40' y='15' width='20' height='70' rx='4'/><rect x='15' y='40' width='70' height='20' rx='4'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='40' y='15' width='20' height='70' rx='4'/><rect x='15' y='40' width='70' height='20' rx='4'/></svg>") center/contain no-repeat;
  }

  .logo-08 .word {
    font-size: 28px; font-weight: 700; color: #111827;
    letter-spacing: -0.03em; margin-top: 8px;
  }
  .logo-08 .word .med { color: #0f766e; }

  .caption { margin-top: 28px; text-align: center; color: #6b7280; font-size: 13px; max-width: 420px; }
  .caption h3 { font-size: 15px; color: #111827; margin-bottom: 4px; font-weight: 600; }
  .palette { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .palette span { width: 22px; height: 22px; border-radius: 6px; }
</style>
</head>
<body>
<div class="badge">08 · APP ICON</div>
<div class="stage">
  <div class="sticker">
    <div class="logo-08">
      <div class="icon-grid">
        <div class="ic ic-32"></div>
        <div class="ic ic-64"></div>
        <div class="ic ic-128"></div>
      </div>
      <div class="word"><span class="med">Medi</span>Slot</div>
    </div>
    <div class="caption">
      <h3>App Icon · Cross on Gradient</h3>
      Square mark with white medical cross over teal gradient. Scales from 16px favicon to 1024px App Store.<br>
      Best for mobile app icon, favicon, social avatar, in-tab favicon.
      <div class="palette">
        <span style="background:linear-gradient(135deg,#14b8a6,#0f766e)"></span>
        <span style="background:#ffffff;border:1px solid #e5e7eb;"></span>
        <span style="background:#0f766e"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
