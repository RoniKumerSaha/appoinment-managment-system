<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo 01 — Clinical Minimal · MediSlot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #f5f6f8; color: #1a1d23; padding: 0; line-height: 1.5; }
  .badge { position: fixed; top: 12px; right: 12px; background: #0f766e; color: white; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; z-index: 100; box-shadow: 0 2px 6px rgba(15,118,110,0.3); }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; }
  .sticker { background: white; padding: 60px 80px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }

  /* ── The Logo ── */
  .logo-01 { display: flex; align-items: center; gap: 14px; font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
  .logo-01 .mark {
    width: 44px; height: 44px; border-radius: 10px;
    background: #0f766e;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 22px;
    letter-spacing: -0.02em;
  }
  .logo-01 .word {
    font-size: 30px; font-weight: 700; color: #0f766e;
    letter-spacing: -0.04em;
  }
  .logo-01 .word .accent { color: #111827; font-weight: 600; }

  .caption { margin-top: 32px; text-align: center; color: #6b7280; font-size: 13px; }
  .caption h3 { font-size: 15px; color: #111827; margin-bottom: 4px; font-weight: 600; }
  .palette { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .palette span { width: 22px; height: 22px; border-radius: 6px; }
</style>
</head>
<body>
<div class="badge">01 · CLINICAL MINIMAL</div>
<div class="stage">
  <div class="sticker">
    <div class="logo-01">
      <div class="mark">M</div>
      <div class="word">Medi<span class="accent">Slot</span></div>
    </div>
    <div class="caption">
      <h3>Clinical Minimal</h3>
      Clean teal square + bicolor wordmark. Reads as confident clinical SaaS.<br>
      Best for desktop navs, dashboards, and B2B surfaces.
      <div class="palette">
        <span style="background:#0f766e"></span>
        <span style="background:#111827"></span>
        <span style="background:#f5f6f8;border:1px solid #e5e7eb;"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
