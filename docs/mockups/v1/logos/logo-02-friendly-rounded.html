<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo 02 — Friendly Rounded · MediSlot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #fef9f4; color: #1a1d23; padding: 0; line-height: 1.5; }
  .badge { position: fixed; top: 12px; right: 12px; background: #f97316; color: white; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; z-index: 100; box-shadow: 0 2px 6px rgba(249,115,22,0.3); }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; }
  .sticker { background: white; padding: 60px 80px; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }

  .logo-02 { display: flex; align-items: center; gap: 14px; font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
  .logo-02 .mark {
    width: 50px; height: 50px; border-radius: 16px;
    background: linear-gradient(135deg, #14b8a6 0%, #0f766e 100%);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 24px;
    box-shadow: 0 4px 12px rgba(15,118,110,0.25);
  }
  .logo-02 .mark::after {
    content: "♥"; position: absolute; opacity: 0; font-size: 8px;
  }
  .logo-02 .word {
    font-size: 32px; font-weight: 800; color: #111827;
    letter-spacing: -0.04em;
  }
  .logo-02 .word .slot {
    background: linear-gradient(135deg, #14b8a6 0%, #0f766e 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .caption { margin-top: 32px; text-align: center; color: #6b7280; font-size: 13px; max-width: 380px; }
  .caption h3 { font-size: 15px; color: #111827; margin-bottom: 4px; font-weight: 600; }
  .palette { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .palette span { width: 22px; height: 22px; border-radius: 6px; }
</style>
</head>
<body>
<div class="badge">02 · FRIENDLY ROUNDED</div>
<div class="stage">
  <div class="sticker">
    <div class="logo-02">
      <div class="mark">M</div>
      <div class="word">Medi<span class="slot">Slot</span></div>
    </div>
    <div class="caption">
      <h3>Friendly Rounded</h3>
      Bigger corner radii, gradient teal, slightly heavier weight. Reads as warm patient-first.<br>
      Best for the patient-facing app and consumer landing.
      <div class="palette">
        <span style="background:linear-gradient(135deg,#14b8a6,#0f766e)"></span>
        <span style="background:#f97316"></span>
        <span style="background:#fef9f4"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
