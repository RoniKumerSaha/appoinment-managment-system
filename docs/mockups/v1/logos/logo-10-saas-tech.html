<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo 10 — SaaS Tech · MediSlot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #fafafa; color: #1a1d23; padding: 0; line-height: 1.5; }
  .badge { position: fixed; top: 12px; right: 12px; background: #18181b; color: white; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; }
  .sticker { background: white; padding: 60px 80px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }

  .logo-10 { display: flex; align-items: center; gap: 14px; font-family: "Inter", sans-serif; }
  .logo-10 .mark {
    width: 38px; height: 38px; border-radius: 8px;
    background: #18181b;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 600; font-size: 18px;
    position: relative;
    overflow: hidden;
  }
  .logo-10 .mark::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, #5eead4 0%, #14b8a6 100%);
    opacity: 0.85;
    width: 50%; height: 100%;
  }
  .logo-10 .mark span { position: relative; z-index: 1; }
  .logo-10 .word {
    font-size: 28px; font-weight: 600; color: #18181b;
    letter-spacing: -0.04em;
  }
  .logo-10 .word .med { color: #14b8a6; font-weight: 700; }
  .logo-10 .word .io { color: #a1a1aa; font-weight: 400; font-size: 22px; }

  .caption { margin-top: 32px; text-align: center; color: #6b7280; font-size: 13px; max-width: 420px; }
  .caption h3 { font-size: 15px; color: #111827; margin-bottom: 4px; font-weight: 600; }
  .palette { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .palette span { width: 22px; height: 22px; border-radius: 6px; }
</style>
</head>
<body>
<div class="badge">10 · SAAS TECH</div>
<div class="stage">
  <div class="sticker">
    <div class="logo-10">
      <div class="mark"><span>M</span></div>
      <div class="word"><span class="med">Medi</span>Slot<span class="io">.io</span></div>
    </div>
    <div class="caption">
      <h3>SaaS Tech</h3>
      Techy startup convention: monogram + .io suffix. Reads as developer-grade SaaS.<br>
      Best for marketing site, GitHub org, product-page footer.
      <div class="palette">
        <span style="background:#18181b"></span>
        <span style="background:linear-gradient(135deg,#5eead4,#14b8a6)"></span>
        <span style="background:#a1a1aa"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
