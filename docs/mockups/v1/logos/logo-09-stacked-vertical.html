<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo 09 — Stacked Vertical · MediSlot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #f5f6f8; color: #1a1d23; padding: 0; line-height: 1.5; }
  .badge { position: fixed; top: 12px; right: 12px; background: #0f766e; color: white; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; z-index: 100; box-shadow: 0 2px 6px rgba(15,118,110,0.3); }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; }
  .sticker { background: white; padding: 60px 80px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }

  .logo-09 {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    font-family: "Inter", sans-serif; text-align: center;
  }
  .logo-09 .mark {
    width: 64px; height: 64px; border-radius: 14px;
    background: #0f766e;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .logo-09 .mark .m { color: white; font-size: 32px; font-weight: 700; }
  .logo-09 .mark .dot {
    position: absolute; right: 8px; bottom: 8px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #fbbf24;
  }
  .logo-09 .word {
    font-size: 28px; font-weight: 700; color: #111827;
    letter-spacing: -0.03em;
    display: flex; align-items: baseline; gap: 4px;
  }
  .logo-09 .word .med { color: #0f766e; }
  .logo-09 .word .slot { font-weight: 500; }
  .logo-09 .tag {
    font-size: 11px; color: #6b7280;
    letter-spacing: 0.3em; text-transform: uppercase;
    font-weight: 600;
  }

  .caption { margin-top: 32px; text-align: center; color: #6b7280; font-size: 13px; max-width: 420px; }
  .caption h3 { font-size: 15px; color: #111827; margin-bottom: 4px; font-weight: 600; }
  .palette { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .palette span { width: 22px; height: 22px; border-radius: 6px; }
</style>
</head>
<body>
<div class="badge">09 · STACKED VERTICAL</div>
<div class="stage">
  <div class="sticker">
    <div class="logo-09">
      <div class="mark"><span class="m">M</span><span class="dot"></span></div>
      <div class="word"><span class="med">Medi</span><span class="slot">Slot</span></div>
      <div class="tag">Clinic Booking · Made Simple</div>
    </div>
    <div class="caption">
      <h3>Stacked Vertical</h3>
      Centered icon-over-wordmark with a tagline strip. Reads as a formal logo lockup.<br>
      Best for splash screens, login pages, sign-up headers, invoice footers.
      <div class="palette">
        <span style="background:#0f766e"></span>
        <span style="background:#fbbf24"></span>
        <span style="background:#111827"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
