<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo 06 — Geometric Slot · MediSlot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 0; line-height: 1.5; }
  .badge { position: fixed; top: 12px; right: 12px; background: #06b6d4; color: white; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; z-index: 100; box-shadow: 0 2px 6px rgba(6,182,212,0.3); }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; }
  .sticker { padding: 60px 80px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }

  .logo-06 { display: flex; align-items: center; gap: 18px; font-family: "Inter", sans-serif; }
  .logo-06 .mark {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-06 .mark svg { width: 100%; height: 100%; }
  .logo-06 .word {
    font-size: 30px; font-weight: 600; color: #f1f5f9;
    letter-spacing: -0.03em;
  }
  .logo-06 .word .accent { color: #06b6d4; font-weight: 500; }

  .caption { margin-top: 32px; text-align: center; color: #94a3b8; font-size: 13px; max-width: 420px; }
  .caption h3 { font-size: 15px; color: #e2e8f0; margin-bottom: 4px; font-weight: 600; }
  .palette { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .palette span { width: 22px; height: 22px; border-radius: 6px; }
</style>
</head>
<body>
<div class="badge">06 · GEOMETRIC SLOT</div>
<div class="stage">
  <div class="sticker">
    <div class="logo-06">
      <div class="mark">
        <!-- Geometric M composed of four slot rectangles -->
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4"  y="6"  width="6" height="36" rx="2" fill="#06b6d4"/>
          <rect x="14" y="18" width="6" height="24" rx="2" fill="#06b6d4" opacity="0.7"/>
          <rect x="24" y="18" width="6" height="24" rx="2" fill="#06b6d4" opacity="0.7"/>
          <rect x="34" y="6"  width="6" height="36" rx="2" fill="#06b6d4"/>
          <rect x="20" y="6"  width="4" height="10" rx="1.5" fill="#06b6d4"/>
        </svg>
      </div>
      <div class="word">Medi<span class="accent">Slot</span></div>
    </div>
    <div class="caption">
      <h3>Geometric Slot</h3>
      SVG abstract "M" built from appointment-slot bars. Dark mode native.<br>
      Best for dark UI nav, technical surfaces, integrations page.
      <div class="palette">
        <span style="background:#0f172a"></span>
        <span style="background:#06b6d4"></span>
        <span style="background:#f1f5f9"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
