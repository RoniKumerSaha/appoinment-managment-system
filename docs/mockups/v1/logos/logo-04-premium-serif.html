<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo 04 — Premium Serif · MediSlot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #0a0f1c; color: #1a1d23; padding: 0; line-height: 1.5; }
  .badge { position: fixed; top: 12px; right: 12px; background: #d4af37; color: #0a0f1c; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; z-index: 100; box-shadow: 0 2px 6px rgba(212,175,55,0.3); }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; background: radial-gradient(ellipse at top, #1a2030 0%, #0a0f1c 70%); }
  .sticker { padding: 60px 80px; }

  .logo-04 { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: "Playfair Display", Georgia, serif; text-align: center; }
  .logo-04 .mark {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1.5px solid #d4af37;
    display: flex; align-items: center; justify-content: center;
    color: #d4af37; font-style: italic; font-size: 20px; font-weight: 600;
  }
  .logo-04 .word {
    font-size: 36px; font-weight: 700; color: #d4af37;
    letter-spacing: 0.02em;
  }
  .logo-04 .tag {
    font-size: 10px; color: #d4af37; opacity: 0.7;
    letter-spacing: 0.4em; text-transform: uppercase;
    font-family: "Inter", sans-serif; font-weight: 500;
  }

  .caption { margin-top: 32px; text-align: center; color: #d4af37; opacity: 0.6; font-size: 13px; max-width: 420px; font-family: "Inter", sans-serif; }
  .caption h3 { font-size: 14px; margin-bottom: 4px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; opacity: 1; }
  .palette { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .palette span { width: 22px; height: 22px; border-radius: 6px; }
</style>
</head>
<body>
<div class="badge">04 · PREMIUM SERIF</div>
<div class="stage">
  <div class="sticker">
    <div class="logo-04">
      <div class="mark">M</div>
      <div class="word">MediSlot</div>
      <div class="tag">Booking · Care · Time</div>
    </div>
    <div class="caption">
      <h3>Premium Serif</h3>
      Gold accent on near-black, serif wordmark, stacked tagline.<br>
      Best for landing-page hero, investor decks, premium clinic tier.
      <div class="palette">
        <span style="background:#0a0f1c"></span>
        <span style="background:#d4af37"></span>
        <span style="background:#1a2030"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
