<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo 07 — Emblem Badge · MediSlot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #f0fdf4; color: #1a1d23; padding: 0; line-height: 1.5; }
  .badge { position: fixed; top: 12px; right: 12px; background: #16a34a; color: white; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; z-index: 100; box-shadow: 0 2px 6px rgba(22,163,74,0.3); }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; }
  .sticker { background: white; padding: 60px 80px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }

  .logo-07 { display: flex; align-items: center; gap: 14px; font-family: "Inter", sans-serif; }
  .logo-07 .mark {
    width: 52px; height: 52px; border-radius: 50%;
    background: white;
    border: 2px solid #16a34a;
    display: flex; align-items: center; justify-content: center;
    color: #16a34a; font-weight: 800; font-size: 18px;
    position: relative;
    box-shadow: 0 0 0 4px #dcfce7;
  }
  .logo-07 .mark::before {
    content: "+"; position: absolute; top: -2px; right: -2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #16a34a; color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .logo-07 .words { display: flex; flex-direction: column; gap: 2px; }
  .logo-07 .word {
    font-size: 26px; font-weight: 700; color: #111827;
    letter-spacing: -0.02em;
  }
  .logo-07 .word .med { color: #16a34a; }
  .logo-07 .tag {
    font-size: 10px; font-weight: 600; color: #6b7280;
    letter-spacing: 0.2em; text-transform: uppercase;
  }

  .caption { margin-top: 32px; text-align: center; color: #6b7280; font-size: 13px; max-width: 420px; }
  .caption h3 { font-size: 15px; color: #111827; margin-bottom: 4px; font-weight: 600; }
  .palette { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .palette span { width: 22px; height: 22px; border-radius: 6px; }
</style>
</head>
<body>
<div class="badge">07 · EMBLEM BADGE</div>
<div class="stage">
  <div class="sticker">
    <div class="logo-07">
      <div class="mark">MS</div>
      <div class="words">
        <div class="word"><span class="med">Medi</span>Slot</div>
        <div class="tag">Verified Care Network</div>
      </div>
    </div>
    <div class="caption">
      <h3>Emblem Badge</h3>
      Circular emblem with medical cross badge. Reads as a trust seal.<br>
      Best for marketing collateral, partner badges, certified-clinic stamps.
      <div class="palette">
        <span style="background:#16a34a"></span>
        <span style="background:#dcfce7"></span>
        <span style="background:#f0fdf4"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
