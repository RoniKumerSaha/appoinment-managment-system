<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" role="img" aria-labelledby="ms-title">
  <title id="ms-title">MediSlot</title>
  <!-- Calendar frame -->
  <rect x="6" y="10" width="40" height="36" rx="7" fill="none" stroke="#0f766e" stroke-width="2.4"/>
  <!-- Header divider -->
  <line x1="6" y1="20" x2="46" y2="20" stroke="#0f766e" stroke-width="2.4"/>
  <!-- Top binders -->
  <line x1="18" y1="6"  x2="18" y2="14" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="34" y1="6"  x2="34" y2="14" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Slot dots (3 small filled slots on header row) -->
  <circle cx="13" cy="25.5" r="1.4" fill="#0f766e"/>
  <circle cx="20" cy="25.5" r="1.4" fill="#0f766e"/>
  <circle cx="27" cy="25.5" r="1.4" fill="#0f766e"/>
  <circle cx="34" cy="25.5" r="1.4" fill="#0f766e"/>
  <circle cx="41" cy="25.5" r="1.4" fill="#0f766e"/>
  <!-- Filled "today" slot (slightly larger, contrasting teal) -->
  <circle cx="13" cy="33" r="2.4" fill="#0f766e"/>
  <!-- Medical cross on right side of calendar -->
  <rect x="32" y="29" width="10" height="3.2" rx="1.2" fill="#0f766e"/>
  <rect x="35.4" y="25.6" width="3.2" height="10" rx="1.2" fill="#0f766e"/>
  <!-- Bottom slot row -->
  <circle cx="20" cy="40.5" r="1.4" fill="#0f766e"/>
  <circle cx="27" cy="40.5" r="1.4" fill="#0f766e"/>
</svg>