<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo 03 — Monoline Icon · MediSlot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #f5f6f8; color: #1a1d23; padding: 0; line-height: 1.5; }
  .badge { position: fixed; top: 12px; right: 12px; background: #6366f1; color: white; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; z-index: 100; box-shadow: 0 2px 6px rgba(99,102,241,0.3); }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; }
  .sticker { background: white; padding: 60px 80px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }

  .logo-03 { display: flex; align-items: center; gap: 16px; font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
  .logo-03 .mark {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-03 .mark svg { width: 100%; height: 100%; }
  .logo-03 .word {
    font-size: 30px; font-weight: 600; color: #111827;
    letter-spacing: -0.03em;
  }
  .logo-03 .word .med { color: #0f766e; }

  .caption { margin-top: 32px; text-align: center; color: #6b7280; font-size: 13px; max-width: 420px; }
  .caption h3 { font-size: 15px; color: #111827; margin-bottom: 4px; font-weight: 600; }
  .palette { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .palette span { width: 22px; height: 22px; border-radius: 6px; }
</style>
</head>
<body>
<div class="badge">03 · MONOLINE ICON</div>
<div class="stage">
  <div class="sticker">
    <div class="logo-03">
      <div class="mark">
        <!-- Calendar-with-medical-cross monoline -->
        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="10" width="40" height="36" rx="7" stroke="#0f766e" stroke-width="2.4"/>
          <line x1="6" y1="20" x2="46" y2="20" stroke="#0f766e" stroke-width="2.4"/>
          <line x1="18" y1="6" x2="18" y2="14" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="34" y1="6" x2="34" y2="14" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round"/>
          <!-- medical cross inside -->
          <rect x="23" y="26" width="6" height="14" rx="1.5" fill="#0f766e"/>
          <rect x="19" y="30" width="14" height="6" rx="1.5" fill="#0f766e"/>
          <!-- slot indicator dot -->
          <circle cx="26" cy="33" r="9" fill="white"/>
        </svg>
      </div>
      <div class="word"><span class="med">Medi</span>Slot</div>
    </div>
    <div class="caption">
      <h3>Monoline Icon</h3>
      Vector calendar slot + medical-cross icon. Pixel-perfect at any size.<br>
      Best for app icon, favicon, social avatars.
      <div class="palette">
        <span style="background:#0f766e"></span>
        <span style="background:#6366f1"></span>
        <span style="background:#ffffff;border:1px solid #e5e7eb;"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
