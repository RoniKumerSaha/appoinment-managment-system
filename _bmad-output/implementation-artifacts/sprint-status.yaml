  #     row, doubly-binds doctor scope, gates status (terminal
  #     → 422), gates time (past → 422), detects no-op moves
  #     (422 no_op_move), validates destination (branch scope,
  #     doctor-at-branch, duration match, FR-046 recheck), and
  #     writes a moved_by_doctor audit row with
  #     `payload={reason: 'conflict_resolution', from, to,
  #     branch_change, type_change}`. GIST exclusion is the
  #     race-safety net (SQLSTATE 23P01 → 409 slot_raced).
  #   - E6-S3 re-uses E1-S2's `outside hours` predicate shape (the
  #     column-ref helper variant) so the admin preview and the
  #     doctor badge cannot diverge on what counts as "affected".
  #     Read-only; no state mutation.
