  #     reschedule routes (E4-S2, E4-S3, E5-S2, E5-S3). When the
  #     source row's recurring_series_id is non-NULL, the audit
  #     row carries `recurring_origin: {series_id}`. Non-recurring
  #     rows carry the existing payload shape unchanged. The
  #     enrichment is purely additive — no migration, no schema
  #     change, no new column on appointment_audit.
